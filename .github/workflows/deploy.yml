# サイト本体と各ゲーム（games.txt）をビルドして GitHub Pages にデプロイするワークフロー
name: Deploy to GitHub Pages

on:
  # mainブランチにプッシュされたときに実行
  push:
    branches:
      - main
  # ゲームのリポジトリの release ブランチが更新されたときに実行
  repository_dispatch:
    types:
      - game-released
  # Actionsタブから手動で実行することも可能
  workflow_dispatch:

# ジョブが必要とする権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 連続で更新されたときは古い実行をキャンセルせず、順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build site and games
        env:
          # lost001 などの非公開リポジトリを読むためのトークン
          GAMES_TOKEN: ${{ secrets.GAMES_TOKEN }}
        run: |
          npm ci
          node scripts/build.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
